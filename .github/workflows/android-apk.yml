name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'apps/markdown/**'
      - 'apps/html/**'
      - 'apps/mindmap/**'
      - 'packages/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

concurrency:
  group: android-apk
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    # pinned: newer images may not ship the Android SDK
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install editor dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci --no-audit --no-fund

      - name: Build web part
        working-directory: mobile
        run: npm run build

      - name: Copy into the Android project
        working-directory: mobile
        run: npx cap sync android

      - name: Build APK
        working-directory: mobile/android
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            # put Gradle's own explanation on the run's summary page (readable without signing in)
            reason=$(awk '/What went wrong/{f=1} /Try:/{f=0} f' gradle.log | head -40)
            [ -z "$reason" ] && reason=$(tail -40 gradle.log)
            reason="${reason//'%'/'%25'}"
            reason="${reason//$'\n'/'%0A'}"
            echo "::error title=Gradle build failed::$reason"
            exit "$status"
          fi
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/IeumOffice-Android.apk"

      - name: Keep the APK with this run
        uses: actions/upload-artifact@v4
        with:
          name: IeumOffice-Android
          path: IeumOffice-Android.apk

      - name: Publish on the android-latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="태블릿용 이음오피스 시험판 (빌드 #${{ github.run_number }}, ${GITHUB_SHA::7}). 태블릿 브라우저에서 아래 IeumOffice-Android.apk 를 눌러 내려받아 설치하세요."
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest IeumOffice-Android.apk --clobber
            gh release edit android-latest --notes "$NOTES"
          else
            gh release create android-latest IeumOffice-Android.apk \
              --prerelease --title "이음오피스 안드로이드 (최신 시험판)" --notes "$NOTES"
          fi
